<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="rc">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rc)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Subtle glow behind icon -->
    <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

    <!-- Decorative geometric border -->
    <rect x="20" y="20" width="472" height="472" rx="76" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.4"/>
    <rect x="32" y="32" width="448" height="448" rx="68" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>

    <!-- Open Quran Book -->
    <g transform="translate(256, 300)">
      <!-- Book shadow -->
      <ellipse cx="0" cy="72" rx="130" ry="10" fill="#011a14" opacity="0.4"/>

      <!-- Left page -->
      <path d="M-6,-100 C-6,-100 -120,-88 -125,-84 L-125,70 C-120,66 -6,55 -6,55 Z" fill="#d1fae5" opacity="0.92"/>
      <!-- Right page -->
      <path d="M6,-100 C6,-100 120,-88 125,-84 L125,70 C120,66 6,55 6,55 Z" fill="#ecfdf5" opacity="0.92"/>

      <!-- Spine -->
      <path d="M-6,-100 L6,-100 L6,55 L-6,55 Z" fill="url(#gold)" opacity="0.85"/>
      <line x1="0" y1="-100" x2="0" y2="55" stroke="#b45309" stroke-width="1" opacity="0.5"/>

      <!-- Arabic text on left page -->
      <text x="-65" y="-50" font-family="serif" font-size="28" fill="#065f46" opacity="0.2" text-anchor="middle" direction="rtl">الْقُرْآن</text>
      <!-- Lines on left page -->
      <line x1="-110" y1="-20" x2="-20" y2="-30" stroke="#065f46" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
      <line x1="-112" y1="2" x2="-18" y2="-8" stroke="#065f46" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
      <line x1="-114" y1="24" x2="-16" y2="14" stroke="#065f46" stroke-width="2" opacity="0.15" stroke-linecap="round"/>

      <!-- Bismillah on right page -->
      <text x="65" y="-30" font-family="serif" font-size="22" fill="#065f46" opacity="0.18" text-anchor="middle" direction="rtl">بِسْمِ اللَّهِ</text>
      <line x1="20" y1="10" x2="110" y2="0" stroke="#065f46" stroke-width="2" opacity="0.12" stroke-linecap="round"/>
      <line x1="18" y1="32" x2="112" y2="22" stroke="#065f46" stroke-width="2" opacity="0.12" stroke-linecap="round"/>
    </g>

    <!-- Crescent Moon & Star -->
    <g transform="translate(256, 160)">
      <!-- Crescent -->
      <path d="M-8,-55 A52,52 0 1,1 -8,55 A38,38 0 1,0 -8,-55 Z" fill="url(#gold)" opacity="0.95"/>
      <!-- Star -->
      <polygon points="30,-8 33,2 43,2 35,8 38,18 30,12 22,18 25,8 17,2 27,2" fill="url(#gold)" opacity="0.9"/>
    </g>

    <!-- Decorative corner dots -->
    <circle cx="56" cy="56" r="3" fill="#fbbf24" opacity="0.3"/>
    <circle cx="456" cy="56" r="3" fill="#fbbf24" opacity="0.3"/>
    <circle cx="56" cy="456" r="3" fill="#fbbf24" opacity="0.3"/>
    <circle cx="456" cy="456" r="3" fill="#fbbf24" opacity="0.3"/>
  </g>
</svg>