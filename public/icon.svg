<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#065f46"/>
  <g transform="translate(50,50)">
    <!-- Open book -->
    <path d="M-2,-28 L-28,-20 L-28,20 L-2,28 Z" fill="#ecfdf5" opacity="0.9"/>
    <path d="M2,-28 L28,-20 L28,20 L2,28 Z" fill="#d1fae5" opacity="0.9"/>
    <!-- Spine -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#fbbf24" stroke-width="2"/>
    <!-- Page lines left -->
    <line x1="-24" y1="-10" x2="-6" y2="-14" stroke="#065f46" stroke-width="1.5" opacity="0.3"/>
    <line x1="-24" y1="-2" x2="-6" y2="-6" stroke="#065f46" stroke-width="1.5" opacity="0.3"/>
    <line x1="-24" y1="6" x2="-6" y2="2" stroke="#065f46" stroke-width="1.5" opacity="0.3"/>
    <line x1="-24" y1="14" x2="-6" y2="10" stroke="#065f46" stroke-width="1.5" opacity="0.3"/>
    <!-- Page lines right -->
    <line x1="24" y1="-10" x2="6" y2="-14" stroke="#065f46" stroke-width="1.5" opacity="0.3"/>
    <line x1="24" y1="-2" x2="6" y2="-6" stroke="#065f46" stroke-width="1.5" opacity="0.3"/>
    <line x1="24" y1="6" x2="6" y2="2" stroke="#065f46" stroke-width="1.5" opacity="0.3"/>
    <line x1="24" y1="14" x2="6" y2="10" stroke="#065f46" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>