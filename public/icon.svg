<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#065f46"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5"/>
      <stop offset="100%" style="stop-color:#d1fae5"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Subtle Islamic geometric pattern overlay -->
    <g opacity="0.08" stroke="#fbbf24" stroke-width="1" fill="none">
      <!-- 8-pointed star pattern -->
      <polygon points="256,60 290,226 456,256 290,286 256,452 222,286 56,256 222,226"/>
      <polygon points="256,100 278,226 404,256 278,286 256,412 234,286 108,256 234,226"/>
      <!-- Corner arcs -->
      <circle cx="80" cy="80" r="60"/>
      <circle cx="432" cy="80" r="60"/>
      <circle cx="80" cy="432" r="60"/>
      <circle cx="432" cy="432" r="60"/>
    </g>

    <!-- Outer decorative border -->
    <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.5"/>
    <rect x="36" y="36" width="440" height="440" rx="72" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

    <!-- Open Book Shape -->
    <g transform="translate(256,280)">
      <!-- Book shadow -->
      <ellipse cx="0" cy="68" rx="140" ry="12" fill="#022c22" opacity="0.3"/>

      <!-- Left page -->
      <path d="M-8,-110 C-8,-110 -130,-95 -135,-90 L-135,75 C-130,70 -8,58 -8,58 Z" fill="url(#pageGrad)" opacity="0.95"/>
      <!-- Right page -->
      <path d="M8,-110 C8,-110 130,-95 135,-90 L135,75 C130,70 8,58 8,58 Z" fill="#f0fdf4" opacity="0.95"/>

      <!-- Book spine -->
      <path d="M-8,-110 L8,-110 L8,58 L-8,58 Z" fill="#fbbf24" opacity="0.9"/>
      <line x1="0" y1="-110" x2="0" y2="58" stroke="#d97706" stroke-width="1.5"/>

      <!-- Text lines on left page -->
      <line x1="-115" y1="-65" x2="-22" y2="-78" stroke="#065f46" stroke-width="2.5" opacity="0.2" stroke-linecap="round"/>
      <line x1="-118" y1="-42" x2="-20" y2="-55" stroke="#065f46" stroke-width="2.5" opacity="0.2" stroke-linecap="round"/>
      <line x1="-120" y1="-19" x2="-18" y2="-32" stroke="#065f46" stroke-width="2.5" opacity="0.2" stroke-linecap="round"/>
      <line x1="-122" y1="4" x2="-17" y2="-9" stroke="#065f46" stroke-width="2.5" opacity="0.2" stroke-linecap="round"/>
      <line x1="-124" y1="27" x2="-15" y2="14" stroke="#065f46" stroke-width="2.5" opacity="0.2" stroke-linecap="round"/>
      <line x1="-126" y1="50" x2="-14" y2="37" stroke="#065f46" stroke-width="2.5" opacity="0.2" stroke-linecap="round"/>

      <!-- Arabic text hint on right page (Bismillah style) -->
      <text x="70" y="-20" font-family="serif" font-size="38" fill="#065f46" opacity="0.25" text-anchor="middle" direction="rtl">بِسْمِ</text>
      <line x1="22" y1="20" x2="118" y2="8" stroke="#065f46" stroke-width="2.5" opacity="0.15" stroke-linecap="round"/>
      <line x1="20" y1="43" x2="120" y2="31" stroke="#065f46" stroke-width="2.5" opacity="0.15" stroke-linecap="round"/>
    </g>

    <!-- Arabic text "ب" (Bayan) at the top -->
    <text x="256" y="145" font-family="serif" font-size="90" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold" direction="rtl">بٓ</text>

    <!-- Small decorative dots -->
    <circle cx="256" cy="160" r="4" fill="#fbbf24" opacity="0.6"/>

    <!-- Crescent moon accent at top -->
    <g transform="translate(256,58)" opacity="0.15">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="6" cy="-4" r="14" fill="#065f46"/>
    </g>
  </g>
</svg>